<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3600" viewBox="0 0 1600 3600" preserveAspectRatio="none" fill="none">
  <defs>
    <radialGradient id="tannin">
      <stop stop-color="#A47B50" stop-opacity=".018"/>
      <stop offset=".68" stop-color="#A47B50" stop-opacity=".025"/>
      <stop offset=".91" stop-color="#95683D" stop-opacity=".068"/>
      <stop offset=".97" stop-color="#95683D" stop-opacity=".028"/>
      <stop offset="1" stop-color="#95683D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash">
      <stop stop-color="#A77B4F" stop-opacity=".065"/>
      <stop offset=".48" stop-color="#A77B4F" stop-opacity=".032"/>
      <stop offset="1" stop-color="#A77B4F" stop-opacity="0"/>
    </radialGradient>
    <filter id="wicked-edge" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .055" numOctaves="3" seed="28" result="fibres"/>
      <feDisplacementMap in="SourceGraphic" in2="fibres" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".55"/>
    </filter>
    <filter id="ring-edge" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".033 .072" numOctaves="2" seed="9" result="fibres"/>
      <feDisplacementMap in="SourceGraphic" in2="fibres" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".35"/>
    </filter>
  </defs>

  <!-- Dilute coffee has wicked into the outer paper; the middle stays ivory. -->
  <g filter="url(#wicked-edge)">
    <ellipse cx="1630" cy="390" rx="290" ry="450" transform="rotate(-12 1630 390)" fill="url(#tannin)"/>
    <ellipse cx="1585" cy="650" rx="155" ry="235" fill="url(#wash)" opacity=".65"/>
    <ellipse cx="-95" cy="1715" rx="305" ry="510" transform="rotate(14 -95 1715)" fill="url(#wash)"/>
    <ellipse cx="1670" cy="2860" rx="300" ry="450" transform="rotate(17 1670 2860)" fill="url(#tannin)" opacity=".8"/>
    <ellipse cx="-90" cy="3540" rx="460" ry="240" fill="url(#wash)" opacity=".65"/>
  </g>

  <!-- A partial cup mark, mostly outside the left trim, with an uneven dry edge. -->
  <g filter="url(#ring-edge)" stroke="#946B44" stroke-linecap="round">
    <path d="M -17 1502 C 28 1495 83 1538 98 1591 C 113 1641 96 1688 59 1720" stroke-width="2.2" opacity=".065"/>
    <path d="M 40 1731 C 14 1742 -10 1744 -32 1737" stroke-width="1.5" opacity=".055"/>
    <path d="M -11 1510 C 34 1507 76 1544 89 1593 C 101 1638 89 1678 61 1707" stroke-width="5" opacity=".018"/>
    <path d="M 84 1553 C 99 1575 106 1603 105 1626" stroke-width=".85" opacity=".075"/>
  </g>

  <!-- A few absorbed droplets, kept sparse and close to the paper edges. -->
  <g fill="#986B40">
    <ellipse cx="1503" cy="890" rx="2.4" ry="3.1" opacity=".055"/>
    <ellipse cx="1518" cy="901" rx="1.1" ry="1.5" opacity=".045"/>
    <ellipse cx="27" cy="1808" rx="2" ry="2.5" opacity=".05"/>
    <ellipse cx="44" cy="1817" rx=".9" ry="1.1" opacity=".06"/>
    <ellipse cx="1542" cy="3176" rx="2.6" ry="1.8" opacity=".045"/>
  </g>
</svg>
