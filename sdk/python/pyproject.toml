[project]
name = "hypercompute-sdk"
version = "0.1.0"
description = "Python client for a Hypercompute gateway running on this machine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypercompute_sdk"]
