<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" fill="none">
  <title>An exploded view of distributed computing</title>
  <desc>Three separated isometric planes represent model layers, a blue execution board, and GPU memory.</desc>
  <defs>
    <pattern id="socket-contacts" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.15" fill="#56564E" opacity=".42"/>
    </pattern>
    <pattern id="die-cells" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M2 2h6v6H2z" stroke="#3E628B" stroke-width=".45" opacity=".44"/>
    </pattern>
  </defs>

  <!-- Assembly guides stop at the exposed faces. -->
  <g stroke="#797970" stroke-width="1" stroke-dasharray="3 6" opacity=".48">
    <path d="M156 196v269M604 196v269M380 308v269"/>
    <path d="M380 80v51M380 238v42M380 378v42"/>
  </g>

  <!-- Memory plane and contact bed. -->
  <g stroke="#34362F" stroke-width="1.25" stroke-linejoin="round">
    <path d="m156 466 224 112 224-112v13L380 591 156 479z" fill="#D8D6CC"/>
    <path d="m380 578 224-112v13L380 591z" fill="#CACAC1"/>
    <path d="m156 466 224-112 224 112-224 112z" fill="#EEECE3"/>
  </g>
  <g transform="matrix(1 .5 -1 .5 380 466)" stroke="#676A5D" stroke-linejoin="round">
    <rect x="-98" y="-98" width="196" height="196" rx="4" stroke-width="1"/>
    <rect x="-72" y="-72" width="144" height="144" rx="3" fill="#E2E0D5" stroke-width="1.2"/>
    <rect x="-62" y="-62" width="124" height="124" fill="url(#socket-contacts)" stroke-width=".65"/>
    <path d="M-79-68v136M79-68v136M-68-79H68M-68 79H68" stroke-width="2" opacity=".6"/>
    <g fill="#D1D0C5" stroke-width=".8">
      <rect x="-105" y="-27" width="13" height="54" rx="2"/>
      <rect x="92" y="-27" width="13" height="54" rx="2"/>
      <rect x="-27" y="-105" width="54" height="13" rx="2"/>
      <rect x="-27" y="92" width="54" height="13" rx="2"/>
    </g>
    <g fill="#F5F1E7" stroke="#575B50" stroke-width="1.2">
      <circle cx="-91" cy="-91" r="4"/><circle cx="91" cy="-91" r="4"/>
      <circle cx="91" cy="91" r="4"/><circle cx="-91" cy="91" r="4"/>
    </g>
  </g>

  <!-- Processor board: traces, memory packages, then the exposed die. -->
  <g stroke="#375975" stroke-width="1.2" stroke-linejoin="round">
    <path d="m156 326 224 112 224-112v9L380 447 156 335z" fill="#88A9CC"/>
    <path d="m380 438 224-112v9L380 447z" fill="#769AC3"/>
    <path d="m156 326 224-112 224 112-224 112z" fill="#C8D9E9"/>
  </g>
  <g transform="matrix(1 .5 -1 .5 380 326)" stroke-linejoin="round">
    <rect x="-100" y="-100" width="200" height="200" rx="3" stroke="#6C90B3" stroke-width=".8"/>
    <g stroke="#527DA2" stroke-width="1" opacity=".72">
      <path d="M-48-28H-63v-54h-23M-48-18h-28v-46h-12M-48-8h-37v-28M-48 8h-37v28M-48 18h-28v46h-12M-48 28h-15v54h-23"/>
      <path d="M48-28h15v-54h23M48-18h28v-46h12M48-8h37v-28M48 8h37v28M48 18h28v46h12M48 28h15v54h23"/>
      <path d="M-28-48v-15h-54v-23M-18-48v-28h-46v-12M-8-48v-37h-28M8-48v-37h28M18-48v-28h46v-12M28-48v-15h54v-23"/>
      <path d="M-28 48v15h-54v23M-18 48v28h-46v12M-8 48v37h-28M8 48v37h28M18 48v28h46v12M28 48v15h54v23"/>
    </g>
    <g fill="#89A8C5" stroke="#3D6588" stroke-width=".9">
      <rect x="-96" y="-28" width="25" height="56" rx="2"/>
      <rect x="71" y="-28" width="25" height="56" rx="2"/>
      <rect x="-28" y="-96" width="56" height="25" rx="2"/>
      <rect x="-28" y="71" width="56" height="25" rx="2"/>
    </g>
    <g stroke="#D6E3EE" stroke-width="1.2" opacity=".75">
      <path d="M-88-20v40M79-20v40M-20-88h40M-20 79h40"/>
    </g>
    <rect x="-51" y="-51" width="102" height="102" rx="3" fill="#A4BFDA" stroke="#365B7A" stroke-width="1.3"/>
    <rect x="-38" y="-38" width="76" height="76" rx="1" fill="#6F9BC4" stroke="#2D5276" stroke-width="1.2"/>
    <rect x="-34" y="-34" width="68" height="68" fill="url(#die-cells)"/>
    <path d="M-14-34v68M10-34v68M-34-12h68M-34 12h68" stroke="#355D84" stroke-width=".75" opacity=".58"/>
    <g fill="#E6EFF4" stroke="#527DA2" stroke-width="1">
      <circle cx="-92" cy="-92" r="3.8"/><circle cx="92" cy="-92" r="3.8"/>
      <circle cx="92" cy="92" r="3.8"/><circle cx="-92" cy="92" r="3.8"/>
    </g>
  </g>

  <!-- Model layers drawn as a clean stack of thin plates. -->
  <g stroke="#45473E" stroke-width="1.25" stroke-linejoin="round">
    <path d="m156 182 224 112 224-112v15L380 309 156 197z" fill="#E0DED4"/>
    <path d="m380 294 224-112v15L380 309z" fill="#D1D1C8"/>
    <path d="m156 182 224-112 224 112-224 112z" fill="#F7F4EC"/>
    <path d="m175 182 205-102 205 102-205 102z" stroke="#B1B2A7" stroke-width=".75"/>
    <path d="m156 187 224 112 224-112M156 192l224 112 224-112" stroke="#ABADA0" stroke-width=".75"/>
  </g>
  <g transform="matrix(1 .5 -1 .5 380 182)">
    <rect x="-70" y="-70" width="140" height="140" rx="4" fill="#F0EEE4" stroke="#C3C4B8" stroke-width=".8"/>
    <path d="M-53-54H53M-53-48H53" stroke="#D2D2C7" stroke-width=".7"/>
  </g>
</svg>
