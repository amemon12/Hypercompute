[project]
name = "hypercompute-x402-proxy"
version = "0.1.0"
description = "x402 paywall in front of a Hypercompute pool: agents pay per request in Base Sepolia test USDC, friends are credited by the layers they served."
requires-python = ">=3.11"
dependencies = [
    "x402[fastapi,httpx,evm]==2.25.0",
    "cdp-sdk==1.48.2",
    "mcp==2.3.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "uvicorn>=0.31,<1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
