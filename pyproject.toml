[project]
name = "hypercompute"
version = "0.1.0"
description = "Friend-compute MVP: pool LAN machines to run one local model together via llama.cpp RPC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "iroh==1.1.0",
]

[project.scripts]
hypercompute = "hypercompute.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/hypercompute"]

[tool.hatch.build.targets.wheel.force-include]
# a friend can install just the wheel (uv tool install) and still get the pinned engine lock + model manifest
"configs/engines.lock.json" = "hypercompute/_configs/engines.lock.json"
"configs/models.example.yaml" = "hypercompute/_configs/models.example.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs the pinned llama.cpp engine and a real model on this host (not a portable protocol test)",
]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"backend/hypercompute/agent/control.py" = ["E501"]  # inline HTML/CSS template
